<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Oracle</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#f6f8fb;--card:#fff;--ink:#0a2242;--quiet:#5b6b82;--line:#dbe3ee;--accent:#007b7e;--bad:#c0392b;--good:#1e8e5a}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1420;--card:#152031;--ink:#e8eef7;--quiet:#9aaac0;--line:#26364d;--accent:#4dd1d3}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;line-height:1.5}
  header{max-width:1040px;margin:0 auto;padding:32px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
  h1{margin:0;font-size:24px}
  .sub{color:var(--quiet);font-size:14px;margin:4px 0 0}
  #check{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:var(--card);color:var(--ink)}
  #check.ok{border-color:var(--good);color:var(--good)} #check.fail{border-color:var(--bad);color:var(--bad)}
  main{max-width:1040px;margin:0 auto;padding:8px 16px 48px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
  section.wide{grid-column:1/-1}
  h2{font-size:16px;margin:0 0 12px}
  label{display:grid;grid-template-columns:28px 1fr 80px;gap:8px;align-items:center;font-size:13px;margin:8px 0}
  input[type=range]{width:100%}
  input[type=number],input[type=text]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit;font-size:13px}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0}
  .row input[type=text]{flex:1}
  button{padding:7px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-size:13px;cursor:pointer}
  .swatch{height:72px;border-radius:8px;border:1px solid var(--line);margin:12px 0 8px}
  .out{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-all}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#f5d5a8;color:#5a3a00;margin-left:6px}
  .err{color:var(--bad);font-size:13px;min-height:1em}
  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
  .chip{border-radius:8px;border:1px solid var(--line);overflow:hidden;font-size:11px}
  .chip div:first-child{height:56px}
  .chip div:last-child{padding:4px 6px;font-family:ui-monospace,Menlo,monospace}
  .chip.brand{outline:2px solid var(--ink);outline-offset:1px}
  @media (max-width:640px){.scale{grid-template-columns:repeat(5,1fr)}}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;overflow:auto;max-height:240px}
  footer{max-width:1040px;margin:0 auto;padding:0 16px 32px;color:var(--quiet);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Color Oracle</h1>
    <p class="sub">색 값은 LLM이 아니라 결정론 계산기가 정합니다 · OKLCH ↔ HEX ↔ CIE LCH</p>
  </div>
  <button id="check" type="button" title="자가 검산 다시 실행">자가 검산 확인 중…</button>
</header>

<main>
  <section>
    <h2>OKLCH → HEX</h2>
    <label>L <input id="oL" type="range" min="0" max="1" step="0.005" value="0.52"><input id="oLn" type="number" step="0.005" value="0.52"></label>
    <label>C <input id="oC" type="range" min="0" max="0.4" step="0.001" value="0.11"><input id="oCn" type="number" step="0.001" value="0.11"></label>
    <label>H <input id="oH" type="range" min="0" max="360" step="0.05" value="196.85"><input id="oHn" type="number" step="0.05" value="196.85"></label>
    <div class="swatch" id="oSw"></div>
    <div class="out" id="oOut"></div>
    <div class="err" id="oErr"></div>
  </section>

  <section>
    <h2>HEX → OKLCH · LCH</h2>
    <div class="row"><input id="hIn" type="text" value="#00b8bb" aria-label="HEX"><button id="hGo" type="button">변환</button></div>
    <div class="swatch" id="hSw"></div>
    <div class="out" id="hOut"></div>
    <div class="err" id="hErr"></div>
  </section>

  <section class="wide">
    <h2>브랜드 색 → 50~900 팔레트</h2>
    <div class="row">
      <input id="sHex" type="text" value="#00b8bb" aria-label="브랜드 HEX">
      <input id="sName" type="text" value="teal" aria-label="이름" style="max-width:140px">
      <button id="sGo" type="button">생성</button>
    </div>
    <div class="scale" id="sScale"></div>
    <p class="sub">테두리 = 브랜드 원색 · <span class="tag" style="margin:0">매핑</span> = sRGB 밖이라 밝기·색상은 두고 채도만 줄인 단계</p>
    <pre id="sCss"></pre>
    <div class="err" id="sErr"></div>
  </section>
</main>

<footer>API: <code>/api/oracle?op=…</code> · LLM 도구 정의: <a href="/api/oracle?op=tools">/api/oracle?op=tools</a> · 근거: Ottosson 2020 (OKLab), W3C CSS Color 4</footer>

<script>
const $ = id => document.getElementById(id);
const api = async params => {
  const r = await fetch('/api/oracle?' + new URLSearchParams(params));
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};

// 자가 검산: 통과해야 쓸 수 있다
async function runCheck() {
  const b = $('check'); b.className = ''; b.textContent = '자가 검산 확인 중…';
  try {
    const r = await api({op: 'selfcheck'});
    b.className = r.ok ? 'ok' : 'fail';
    b.textContent = r.ok ? `자가 검산 ${r.items.length}/${r.items.length} 통과` : '자가 검산 실패';
    b.title = r.items.join('\n');
  } catch (e) { b.className = 'fail'; b.textContent = 'API 연결 실패'; }
}
$('check').onclick = runCheck;

// OKLCH → HEX (슬라이더와 숫자 입력 동기화, 요청은 짧게 늦춰서)
let t;
function syncPair(a, b) {
  $(a).oninput = () => { $(b).value = $(a).value; schedule(); };
  $(b).oninput = () => { $(a).value = $(b).value; schedule(); };
}
syncPair('oL', 'oLn'); syncPair('oC', 'oCn'); syncPair('oH', 'oHn');
function schedule() { clearTimeout(t); t = setTimeout(convOk, 120); }
async function convOk() {
  const L = $('oLn').value, C = $('oCn').value, H = $('oHn').value;
  try {
    const r = await api({op: 'oklch2hex', L, C, H});
    $('oSw').style.background = r.hex;
    $('oOut').innerHTML = `oklch(${L} ${C} ${H}) → <b>${r.hex}</b>` + (r.gamut_mapped ? '<span class="tag">매핑</span>' : '');
    $('oErr').textContent = '';
  } catch (e) { $('oErr').textContent = e.message; }
}

// HEX → OKLCH · LCH
async function convHex() {
  const hex = $('hIn').value;
  try {
    const [o, l] = await Promise.all([api({op: 'hex2oklch', hex}), api({op: 'hex2lch', hex})]);
    $('hSw').style.background = hex.startsWith('#') ? hex : '#' + hex;
    $('hOut').innerHTML = `${o.css}<br>${l.css}`;
    $('hErr').textContent = '';
  } catch (e) { $('hErr').textContent = e.message; }
}
$('hGo').onclick = convHex;
$('hIn').onkeydown = e => { if (e.key === 'Enter') convHex(); };

// 팔레트
async function makeScale() {
  try {
    const r = await api({op: 'scale', hex: $('sHex').value, name: $('sName').value});
    $('sScale').innerHTML = Object.entries(r.steps).map(([s, v]) =>
      `<div class="chip${v.brand ? ' brand' : ''}" title="${v.oklch}"><div style="background:${v.hex}"></div><div>${s}<br>${v.hex}${v.gamut_mapped ? '<span class="tag">매핑</span>' : ''}</div></div>`
    ).join('');
    $('sCss').textContent = r.css;
    $('sErr').textContent = '';
  } catch (e) { $('sErr').textContent = e.message; }
}
$('sGo').onclick = makeScale;

runCheck(); convOk(); convHex(); makeScale();
</script>
</body>
</html>
